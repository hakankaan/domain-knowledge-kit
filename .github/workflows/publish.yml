name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # v5 is the first major on the Node 24 runtime. Held at v5 rather than
      # the latest: v6/v7 change caching defaults and drop setup-node's dummy
      # NODE_AUTH_TOKEN export, which sits on the Trusted Publishing auth path
      # this workflow only exercises at release time.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for Trusted Publishing
        run: npm i -g npm@11.10.1

      - name: Install dependencies
        run: npm ci

      # Guard: package.json version must match the release tag (strip leading 'v')
      - name: Verify version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌  package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅  Version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Typecheck & lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
